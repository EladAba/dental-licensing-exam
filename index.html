const SUPABASE_URL='https://bgbvvrkvogegvgefkluk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_5_oo-wedbC9dCfBhHvU-lA_XYFfNrV_';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null;
let examStartedAt=null;
async function setAuthUI(user){
  currentUser=user||null;
  auth.classList.toggle('hidden',!!user);
  exam.classList.toggle('hidden',!user);
  dashboard.classList.toggle('hidden',!user);
  logoutBtn.classList.toggle('hidden',!user);
  userEmail.textContent=user?user.email:'';
  if(user){ if(!examStartedAt) examStartedAt=new Date(); await loadHistory(); render(); }
}
async function loginUser(){
  authMsg.innerHTML='';
  const email=authEmail.value.trim(),password=authPassword.value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){authMsg.innerHTML='<div class="error-box">'+esc(error.message)+'</div>';return}
  await setAuthUI(data.user);
}
async function signupUser(){
  authMsg.innerHTML='';
  const email=authEmail.value.trim(),password=authPassword.value;
  if(!email||password.length<6){authMsg.innerHTML='<div class="error-box">יש להזין אימייל וסיסמה של לפחות 6 תווים.</div>';return}
  const {data,error}=await sb.auth.signUp({email,password});
  if(error){authMsg.innerHTML='<div class="error-box">'+esc(error.message)+'</div>';return}
  if(data.session){await setAuthUI(data.user)} else authMsg.innerHTML='<div class="success-box">ההרשמה נוצרה. אם נשלח אליך אימייל אימות, יש לאשר אותו ואז להתחבר.</div>';
}
async function logoutUser(){ await sb.auth.signOut(); currentUser=null; location.reload(); }
async function loadHistory(){
  const {data,error}=await sb.from('exam_attempts').select('id,completed_at,score_percent,correct_verified_count,verified_question_count,question_count,duration_seconds').order('created_at',{ascending:false}).limit(20);
  if(error){historySummary.textContent='לא ניתן לטעון כרגע את היסטוריית המבחנים.';return}
  historySummary.textContent=data.length?`נשמרו ${data.length} ניסיונות אחרונים בחשבון שלך.`:'עדיין לא נשמרו ניסיונות בחשבון זה.';

}
async function saveAttempt(){
  if(!currentUser)return;
  const verified=Q.filter(q=>q.scoreEligible!==false&&q.answer!=null).length;
  const correct=Q.reduce((n,q,i)=>n+(q.scoreEligible!==false&&q.answer!=null&&ans[i]===q.answer),0);

}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

'משמרת וחומרים':16,'בקרת זיהומים ואתיקה':12,'אורתודונטיה וגדילה':8
};
function buildExam(bank,n=180){
  const selected=[],counts=new Map();
  const addFrom=(pool,target,maxPerConcept)=>{
    for(const q of shuffle(pool.slice())){
      if(selected.length>=target) break;
      const c=counts.get(q.conceptId)||0;
      if(c>=maxPerConcept) continue;
      selected.push(q); counts.set(q.conceptId,c+1);
    }
  };
  // רוב הבחינה נבנה משאלות שמאומתות מול מקור מקצועי נגיש.
  addFrom(bank.filter(q=>q.verificationStatus==='verified_authoritative'),120,2);
  // כדי לשמור כיסוי של שיקום/חומרים/אורתודונטיה וספרות משרד הבריאות,
  // משלבים גם שאלות המסומנות במפורש כ"נדרש אימות". הן אינן נכנסות לציון המאומת.
  addFrom(bank.filter(q=>q.verificationStatus!=='verified_authoritative'),n,1);
  if(selected.length<n) addFrom(bank.filter(q=>q.verificationStatus==='verified_authoritative'),n,4);
  return shuffle(selected).slice(0,n);
}

const IMAGE_REQUIRED_2025 = new Set([1,5,9,46]);
const IMAGE_REQUIRED_2026 = new Set([1,2,5]);
function questionImageKey(q){
  const year=q.source==='חורף 2025'?'2025':q.source==='חורף 2026'?'2026':null;
  if(!year) return null;
  const n=Number(q.sourceNumber||0);
  const allowed=(year==='2025'?IMAGE_REQUIRED_2025:IMAGE_REQUIRED_2026);
  if(!allowed.has(n)) return null;
  return `w${year}-q${n}`;
}
function questionNeedsImage(q){return !!questionImageKey(q);}
function imageHtml(q){
  const key=questionImageKey(q);
  if(!key) return '';
  const src=QUESTION_IMAGES[key];
  if(!src) return '<p class="warn">תמונת השאלה אינה זמינה.</p>';
  return `<div class="qimg-wrap"><img src="${src}" alt="תמונה לשאלה ${q.sourceNumber}"><div class="qimg-caption">תמונה ממוקדת השייכת לשאלה בלבד • ${esc(q.source)} • שאלה ${q.sourceNumber}</div></div>`;
}
let idx=0,ans=Array(Q.length).fill(null),flags=Array(Q.length).fill(false),seconds=3*60*60;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){let q=Q[idx];num.textContent=`שאלה ${idx+1} מתוך ${Q.length}`;topic.textContent=q.topic;source.textContent=(q.verificationStatus==='verified_authoritative'?'✓ מאומת':'⚠ נדרש אימות')+' • '+q.source+(q.variant?' • וריאציית תרגול':'');stem.textContent=q.stem;questionImage.innerHTML=imageHtml(q);options.innerHTML=q.options.map((o,i)=>`<label class="opt"><input type="radio" name="o" ${ans[idx]===i?'checked':''} onchange="ans[${idx}]=${i};renderGrid()">${String.fromCharCode(1488+i)}. ${esc(o)}</label>`).join('');flag.checked=flags[idx];renderGrid()}flag.onchange=()=>{flags[idx]=flag.checked;renderGrid()};function move(d){idx=Math.max(0,Math.min(Q.length-1,idx+d));render()}function renderGrid(){grid.innerHTML=Q.map((_,i)=>`<button class="${ans[i]!=null?'answered ':''}${i===idx?'current ':''}${flags[i]?'flagged':''}" onclick="idx=${i};render()">${i+1}</button>`).join('')}

function state(i){let q=Q[i];if(ans[i]==null)return'unanswered';if(q.scoreEligible===false||q.answer==null)return'unverified';return ans[i]===q.answer?'correct':'wrong'}function renderReview(){let sf=statusFilter.value,tf=topicFilter.value,term=search.value.trim();let verified=Q.filter(q=>q.scoreEligible!==false&&q.answer!=null).length,correct=Q.reduce((n,q,i)=>n+(q.scoreEligible!==false&&q.answer!=null&&ans[i]===q.answer),0);score.innerHTML=`<p><b>שאלות הנכללות בציון המאומת:</b> ${verified} מתוך ${Q.length} שאלות. ציון: <b>${verified?Math.round(correct/verified*100):0}%</b>.</p><p class="muted">הציון מחושב רק משאלות שסומנו כמאומתות מול מקור מוסמך. שאלות המסומנות "נדרש לבדוק מול הספרות" מוצגות לתרגול אך אינן משפיעות על הציון המאומת.</p>`;review.innerHTML=Q.map((q,i)=>[q,i]).filter(([q,i])=>{let st=state(i);return(sf==='all'||sf===st||(sf==='flagged'&&flags[i]))&&(tf==='all'||q.topic===tf)&&(!term||q.stem.includes(term)||q.options.join(' ').includes(term))}).map(([q,i])=>{let st=state(i),chosen=ans[i],label=st==='correct'?'<span class="good">נכון</span>':st==='wrong'?'<span class="bad">שגוי</span>':st==='unanswered'?'<span class="warn">לא נענה</span>':'<span class="warn">ללא מפתח מאומת</span>';let corr=q.answer!=null?q.options[q.answer]:'לא נקבעה בגרסה זו';let optionAudit=q.options.map((o,oi)=>{let isCorrect=oi===q.answer,isChosen=oi===chosen;let why=isCorrect?q.explanation:'אפשרות זו אינה התשובה המתאימה ביותר לנתונים או לעיקרון שנבדק בשאלה; ההסבר לתשובה הנכונה מופיע להלן.';return `<div style="padding:8px 10px;margin:6px 0;border:1px solid #e2e6ea;border-radius:8px"><b>${String.fromCharCode(1488+oi)}. ${esc(o)}</b> ${isCorrect?'<span class="good">✓ נכונה</span>':'<span class="bad">✗ אינה נכונה</span>'}${isChosen?' <span class="tag">סומנה על ידך</span>':''}<div class="muted" style="margin-top:4px">${esc(why)}</div></div>`}).join('');return `<div class="review"><h3>שאלה ${i+1} • ${q.topic} • ${label}</h3><p>${esc(q.stem)}</p>${imageHtml(q)}<p><b>התשובה שסומנה:</b> ${chosen!=null?esc(q.options[chosen]):'לא סומנה תשובה'}</p><p><b>התשובה הנכונה:</b> ${esc(corr)}</p><p><b>הסבר מרכזי:</b> ${esc(q.explanation)}</p><div>${optionAudit}</div><small><b>מקור:</b> ${esc(q.reference||q.source||'לא צוין')}${q.referenceUrl&&q.referenceUrl.startsWith('http')?` • <a href="${q.referenceUrl}" target="_blank" rel="noopener">פתח מקור</a>`:''}<br><b>סטטוס אימות:</b> ${q.verificationStatus==='verified_authoritative'?'מאומת מול מקור מוסמך':'נדרש לבדוק מול הספרות'}${q.verificationNote?` • ${esc(q.verificationNote)}`:''}</small></div>`}).join('')}render();
